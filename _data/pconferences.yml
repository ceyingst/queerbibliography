- title: "Queer Bibliography: In the Making"
  date: June 2025
  location: Northumbria University, Newcastle, UK & online
  description: "QB 'In the Making' provided an opportunity for participants to come together and consider how material texts are made, unmade, and remade queerly by an array of agents engaged in literary, textual, and material invention, including scribes, printers, typefounders, papermakers, bookbinders, readers, booksellers, collectors, librarians, publishers, and editors. It featured two days of panel presentations, and a third day devoted to a hands-on Zine workshop."
- title: "Queer Bibliography: Borders, Boundaries, and Margins"
  date: July 2024
  location: University of California, Los Angeles, USA & online
  description: "QB 'Borders, Boundaries, and Margins' explored how the theories and practices of queer bibliography inhabit areas of liminality and in-betweenness, and interrogated how queer orientations and approaches can reshape the cartography of bibliography and its allied areas of inquiry. This iteration of the conference invited participants to delve into the ways in which queer bibliography navigates and challenges traditional boundaries, be they geographical, disciplinary, institutional, methodological, or conceptual."
